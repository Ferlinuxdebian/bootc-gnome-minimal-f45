name: Build, Push e Assinatura da Imagem Bootc
on:
  schedule:
    - cron: '32 4 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'security/README.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ferlinuxdebian/bootc-gnome-minimal-f45
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-sign-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"

      - name: Gerar metadados do build
        id: meta
        run: |
          VERSION=$(grep '^FROM' Containerfile | head -n 1 | awk -F: '{print $2}' | awk '{print $1}')
          DATE=$(TZ='America/Sao_Paulo' date +'%Y%m%d-%H%M')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          PRIMARY="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-${DATE}"

          echo "version=${VERSION}"     >> "$GITHUB_OUTPUT"
          echo "date=${DATE}"           >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "primary=${PRIMARY}"     >> "$GITHUB_OUTPUT"

      - name: Login no GHCR (podman)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login \
            -u "${{ github.actor }}" --password-stdin "${{ env.REGISTRY }}"

      - name: Build da imagem inicial (como root)
        run: |
          sudo podman build \
            --skip-unused-stages=false \
            --security-opt label=disable \
            -t "localhost/bootc-raw:latest" \
            -f Containerfile \
            -v "$(pwd):/run/src" \
            .

      - name: Rechunk via bootc-base-imagectl (fedora-bootc:45)
        run: |
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:45 \
            /usr/libexec/bootc-base-imagectl rechunk \
            localhost/bootc-raw:latest \
            "${{ steps.meta.outputs.primary }}"

      - name: Push da tag principal e captura do digest
        run: |
          sudo podman push --digestfile /tmp/image-digest \
            "${{ steps.meta.outputs.primary }}"
          DIGEST=$(sudo cat /tmp/image-digest)
          echo "Imagem publicada: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"

      - name: Instalar cosign
        # Fixado por SHA: esta Action manipula a chave privada de assinatura.
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          # v2.x grava a assinatura no formato de anexo ".sig", que é o formato
          # que o bootc/containers-image descobre via use-sigstore-attachments.
          cosign-release: 'v2.4.3'

      - name: Login no GHCR (cosign)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login "${{ env.REGISTRY }}" \
            -u "${{ github.actor }}" --password-stdin

      - name: Assinar a imagem pelo digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Verificar a assinatura (gate de CI)
        run: |
          cosign verify --key security/cosign.pub \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Aplicar e enviar tags adicionais
        run: |
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          PRIMARY="${{ steps.meta.outputs.primary }}"

          for TAG in "latest" "main" "sha-${SHORT_SHA}"; do
            echo "→ Taguando e enviando :${TAG}"
            sudo podman tag "${PRIMARY}" "${BASE}:${TAG}"
            sudo podman push "${BASE}:${TAG}"
          done
